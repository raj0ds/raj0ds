<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Sango Sathi architecture. A user starts with a WhatsApp message or a missed call. Speech is transcribed and translated, Meta AI classifies intent, and the query routes to one of six district flows: banks, hospitals, police, tourism, transport and schemes. Each returns a list and then category-specific detail such as a map pin, a public phone number, a police helpline, timetables or scheme eligibility, before the answer is translated back and spoken.">
