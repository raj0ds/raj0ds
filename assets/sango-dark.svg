<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Sango Sathi: a public WhatsApp assistant for Khunti district. A user starts it by typing Hi or by giving a missed call. Speech is transcribed, translated, answered by Meta AI over district knowledge, translated back and spoken, returning a list of nearby places, then a map and public contact details for the one chosen.">
