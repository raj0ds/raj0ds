<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Elevate consumer intelligence pipeline: ingest, smart sampling, aspect extraction, tiered schema, serve, with an agentic layer and analytics outputs">
  <rect width="1200" height="470" fill="#12181C"/>

  <g font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">

    <rect x="40" y="34" width="60" height="3" fill="#A8681A"/>
    <text x="40" y="72" fill="#12181C" font-size="22" font-weight="700">Elevate — consumer intelligence platform</text>
    <text x="40" y="96" fill="#5C6B70" font-size="14">An 11-step AI/NLP pipeline. Full-coverage analysis replacing sampled review reads.</text>

    <!-- ============ pipeline stages ============ -->
    <g>
      <rect x="40" y="126" width="200" height="98" rx="12" fill="#FFFFFF" stroke="#D6D0C4" stroke-width="1.5"/>
      <text x="60" y="158" fill="#A8681A" font-size="11" font-weight="600" letter-spacing="2">01 · INGEST</text>
      <text x="60" y="184" fill="#12181C" font-size="16" font-weight="600">400K+ records / yr</text>
      <text x="60" y="206" fill="#5C6B70" font-size="12.5">50+ brands · 300+ families</text>

      <rect x="270" y="126" width="200" height="98" rx="12" fill="#FFFFFF" stroke="#D6D0C4" stroke-width="1.5"/>
      <text x="290" y="158" fill="#A8681A" font-size="11" font-weight="600" letter-spacing="2">02 · SAMPLING</text>
      <text x="290" y="184" fill="#12181C" font-size="16" font-weight="600">Smart sampling</text>
      <text x="290" y="206" fill="#5C6B70" font-size="12.5">TF-IDF + K-Means</text>

      <rect x="500" y="126" width="200" height="98" rx="12" fill="#FFFFFF" stroke="#D6D0C4" stroke-width="1.5"/>
      <text x="520" y="158" fill="#A8681A" font-size="11" font-weight="600" letter-spacing="2">03 · EXTRACT</text>
      <text x="520" y="184" fill="#12181C" font-size="16" font-weight="600">Aspect extraction</text>
      <text x="520" y="206" fill="#5C6B70" font-size="12.5">concurrent · Azure OpenAI</text>

      <rect x="730" y="126" width="200" height="98" rx="12" fill="#FFFFFF" stroke="#D6D0C4" stroke-width="1.5"/>
      <text x="750" y="158" fill="#A8681A" font-size="11" font-weight="600" letter-spacing="2">04 · SCHEMA</text>
      <text x="750" y="184" fill="#12181C" font-size="16" font-weight="600">Tiered schema</text>
      <text x="750" y="206" fill="#5C6B70" font-size="12.5">94% token reduction</text>

      <rect x="960" y="126" width="200" height="98" rx="12" fill="#FFFFFF" stroke="#D6D0C4" stroke-width="1.5"/>
      <text x="980" y="158" fill="#A8681A" font-size="11" font-weight="600" letter-spacing="2">05 · SERVE</text>
      <text x="980" y="184" fill="#12181C" font-size="16" font-weight="600">FastAPI · Azure SQL</text>
      <text x="980" y="206" fill="#5C6B70" font-size="12.5">blob store + cache layer</text>
    </g>

    <!-- connectors -->
    <g stroke="#9AA4A2" stroke-width="1.6" fill="none">
      <path d="M244 175 h18"/><path d="M256 169 l7 6 -7 6" fill="#9AA4A2" stroke="none"/>
      <path d="M474 175 h18"/><path d="M486 169 l7 6 -7 6" fill="#9AA4A2" stroke="none"/>
      <path d="M704 175 h18"/><path d="M716 169 l7 6 -7 6" fill="#9AA4A2" stroke="none"/>
      <path d="M934 175 h18"/><path d="M946 169 l7 6 -7 6" fill="#9AA4A2" stroke="none"/>
    </g>

    <!-- ============ agentic layer ============ -->
    <rect x="40" y="266" width="1120" height="94" rx="12" fill="#FBFAF6" stroke="#14494F" stroke-width="1.5" stroke-opacity="0.55"/>

    <g transform="translate(104 313)">
      <rect x="-34" y="-34" width="68" height="68" rx="10" fill="none" stroke="#14494F" stroke-width="1.2" stroke-opacity="0.35"/>
      <rect x="-26" y="-26" width="52" height="52" rx="8"  fill="none" stroke="#14494F" stroke-width="1.2" stroke-opacity="0.55"/>
      <rect x="-18" y="-18" width="36" height="36" rx="6"  fill="none" stroke="#14494F" stroke-width="1.2" stroke-opacity="0.75"/>
      <rect x="-10" y="-10" width="20" height="20" rx="4"  fill="none" stroke="#14494F" stroke-width="1.2" stroke-opacity="0.95"/>
      <g fill="#A8681A">
        <circle cx="0" cy="-24" r="3.2"/><circle cx="20.8" cy="-12" r="3.2"/><circle cx="20.8" cy="12" r="3.2"/>
        <circle cx="0" cy="24" r="3.2"/><circle cx="-20.8" cy="12" r="3.2"/><circle cx="-20.8" cy="-12" r="3.2"/>
      </g>
    </g>

    <text x="168" y="300" fill="#14494F" font-size="11" font-weight="600" letter-spacing="2">AGENTIC LAYER</text>
    <text x="168" y="326" fill="#12181C" font-size="17" font-weight="600">6-tool autonomous reasoning loop</text>
    <text x="168" y="348" fill="#5C6B70" font-size="13">4-layer hallucination guardrails · intelligent routing, caching, templated execution</text>

    <rect x="922" y="288" width="216" height="50" rx="8" fill="#FDF4E4" stroke="#A8681A" stroke-width="1.3" stroke-opacity="0.7"/>
    <text x="1030" y="308" fill="#A8681A" font-size="18" font-weight="700" text-anchor="middle">75% API cost cut</text>
    <text x="1030" y="326" fill="#8A6520" font-size="11.5" text-anchor="middle">94% fewer tokens</text>

    <!-- ============ outputs ============ -->
    <text x="40" y="396" fill="#14494F" font-size="11" font-weight="600" letter-spacing="2">DELIVERS</text>

    <g font-size="13" fill="#3C4A4E">
      <rect x="40"  y="408" width="196" height="34" rx="17" fill="none" stroke="#D6D0C4" stroke-width="1.4"/>
      <text x="138" y="430" text-anchor="middle">Multi-brand analytics</text>

      <rect x="252" y="408" width="222" height="34" rx="17" fill="none" stroke="#D6D0C4" stroke-width="1.4"/>
      <text x="363" y="430" text-anchor="middle">BOM-linked complaints</text>

      <rect x="490" y="408" width="164" height="34" rx="17" fill="none" stroke="#D6D0C4" stroke-width="1.4"/>
      <text x="572" y="430" text-anchor="middle">NPD insights</text>

      <rect x="670" y="408" width="212" height="34" rx="17" fill="none" stroke="#D6D0C4" stroke-width="1.4"/>
      <text x="776" y="430" text-anchor="middle">Sankey dashboards</text>

      <rect x="898" y="408" width="262" height="34" rx="17" fill="none" stroke="#D6D0C4" stroke-width="1.4"/>
      <text x="1029" y="430" text-anchor="middle">Kubernetes · OAuth endpoints</text>
    </g>

  </g>
</svg>
