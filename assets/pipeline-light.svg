<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 414" width="1200" height="414" role="img" aria-label="Specification of the Elevate consumer intelligence pipeline: ingest, sampling, extraction, schema, serving, and the agentic layer.">
  <rect width="1200" height="414" fill="#E9EBEE"/>

  <g font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif">
    <text x="72" y="78" fill="#15181D" font-size="26" font-weight="700">Elevate, a consumer intelligence platform</text>
    <text x="72" y="108" fill="#3A4150" font-size="16" font-style="italic">Eleven steps. It replaced sampled review reads with every record, every year.</text>
  </g>

  <rect x="72" y="126" width="1056" height="2" fill="#2440C8"/>

  <!-- stage rows: name, what runs, and the decision that made it cheap -->
  <g>
    <g font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="17" fill="#15181D">
      <text x="72" y="166">Ingest</text>
      <text x="72" y="206">Sampling</text>
      <text x="72" y="246">Extraction</text>
      <text x="72" y="286">Schema</text>
      <text x="72" y="326">Serving</text>
    </g>

    <g font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="14" fill="#15181D">
      <text x="270" y="166">400,000 records a year</text>
      <text x="270" y="206">TF-IDF + K-Means</text>
      <text x="270" y="246">concurrent, Azure OpenAI</text>
      <text x="270" y="286">tiered response schema</text>
      <text x="270" y="326">FastAPI, Azure SQL, blob</text>
    </g>

    <g font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="14.5" font-style="italic">
      <text x="656" y="166" fill="#697180">50+ brands, 300+ product families</text>
      <text x="656" y="206" fill="#2440C8">decides what actually needs an LLM call</text>
      <text x="656" y="246" fill="#697180">ThreadPoolExecutor across aspects</text>
      <text x="656" y="286" fill="#2440C8">decides how much structure each call returns</text>
      <text x="656" y="326" fill="#697180">cached, OAuth-secured, on Kubernetes</text>
    </g>

    <g stroke="#C6CAD2" stroke-width="1">
      <line x1="72" y1="182" x2="1128" y2="182"/>
      <line x1="72" y1="222" x2="1128" y2="222"/>
      <line x1="72" y1="262" x2="1128" y2="262"/>
      <line x1="72" y1="302" x2="1128" y2="302"/>
    </g>
  </g>

  <rect x="72" y="344" width="1056" height="1.5" fill="#9AA1AE"/>

  <g>
    <text x="72" y="380" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="17" fill="#15181D">Agentic layer</text>
    <text x="270" y="380" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="14" fill="#15181D">6-tool reasoning loop</text>
    <text x="656" y="380" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="14.5" font-style="italic" fill="#697180">held inside four layers of hallucination guardrails</text>
  </g>
</svg>
