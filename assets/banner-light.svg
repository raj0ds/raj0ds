      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="#f8fafc"/>
  <ellipse cx="880" cy="180" rx="420" ry="240" fill="url(#glow)"/>

  <g fill="#e2e8f0">
    <circle cx="150" cy="52" r="1.4"/><circle cx="420" cy="96" r="1.1"/><circle cx="300" cy="320" r="1.3"/>
    <circle cx="560" cy="44" r="1.2"/><circle cx="88" cy="248" r="1.1"/><circle cx="1150" cy="70" r="1.3"/>
    <circle cx="1080" cy="330" r="1.1"/><circle cx="640" cy="300" r="1.2"/><circle cx="200" cy="140" r="1"/>
  </g>

  <!-- status -->
  <rect x="72" y="76" width="228" height="28" rx="14" fill="rgba(5,150,105,0.10)" stroke="#059669" stroke-opacity="0.45"/>
  <circle cx="90" cy="90" r="3.6" fill="#059669"/>
  <text x="102" y="94" font-family="Consolas, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="11" fill="#059669" letter-spacing="1.6">OPEN TO OPPORTUNITIES</text>

