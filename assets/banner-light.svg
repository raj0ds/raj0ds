  <g>
    <rect x="620" y="66" width="520" height="228" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <path d="M620 76 a10 10 0 0 1 10 -10 h500 a10 10 0 0 1 10 10 v24 h-520 z" fill="#f1f5f9"/>
    <line x1="620" y1="100" x2="1140" y2="100" stroke="#e2e8f0"/>
    <circle cx="640" cy="83" r="4.5" fill="#ff5f57"/>
    <circle cx="656" cy="83" r="4.5" fill="#febc2e"/>
    <circle cx="672" cy="83" r="4.5" fill="#28c840"/>
    <text x="694" y="87" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11.5" fill="#475569">profile.json</text>

    <g font-family="Consolas, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="13">
      <g fill="#94a3b8">
        <text x="640" y="132">1</text><text x="640" y="156">2</text><text x="640" y="180">3</text>
        <text x="640" y="204">4</text><text x="640" y="228">5</text><text x="640" y="252">6</text>
        <text x="640" y="276">7</text>
      </g>

      <text x="670" y="132" fill="#475569">{</text>

      <text x="686" y="156" fill="#0891b2">"org":</text>
      <text x="790" y="156" fill="#059669">"VCreaTek, ARDRA"</text>
      <text x="686" y="180" fill="#0891b2">"focus":</text>
      <text x="790" y="180" fill="#059669">"agentic AI, FHIR ePI"</text>
      <text x="686" y="204" fill="#0891b2">"scale":</text>
      <text x="790" y="204" fill="#059669">"400K records / year"</text>
      <text x="686" y="228" fill="#0891b2">"api_cost":</text>
      <text x="790" y="228" fill="#d97706">-75%</text>
      <text x="686" y="252" fill="#0891b2">"tokens":</text>
      <text x="790" y="252" fill="#d97706">-94%</text>

      <text x="670" y="276" fill="#475569">}</text>
