  <g font-family="'Segoe UI Semibold', 'Space Grotesk', 'Segoe UI', Inter, system-ui, sans-serif" font-weight="700" letter-spacing="3">
    <text x="72" y="168" font-size="52" fill="#0f172a">RAJEEV</text>
    <text x="72" y="222" font-size="52" fill="url(#nameGrad)">ANAND</text>
