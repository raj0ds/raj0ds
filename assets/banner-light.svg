  <rect x="1000" y="40" width="124" height="46" rx="9" fill="#6d28d9"/>
  <text x="1062" y="61" font-family="'Segoe UI Semibold', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2y 9m</text>
  <text x="1062" y="77" font-family="Consolas, 'JetBrains Mono', monospace" font-size="9.5" fill="#ede9fe" text-anchor="middle">at VCreaTek</text>
