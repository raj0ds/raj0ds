<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Rajeev Anand, Data and AI Lead at VCreaTek. Agentic AI and FHIR ePI. 400K records a year, 75 percent less API spend, 94 percent fewer tokens.">
  <defs>
