<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Rajeev Anand, Data and AI Lead at VCreaTek. Unstructured language in, validated structure out. 75 percent less API spend, 94 percent fewer tokens, full coverage.">
  <rect width="1200" height="340" fill="#12151A"/>

  <!-- who -->
  <g font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif">
    <text x="72" y="128" fill="#E9EBEE" font-size="53" font-weight="700">Rajeev Anand</text>
    <rect x="72" y="148" width="188" height="3" fill="#8AA0FF"/>
    <text x="72" y="190" fill="#AEB6C4" font-size="21">Data &amp; AI Lead, VCreaTek</text>
    <text x="72" y="245" fill="#E9EBEE" font-size="18" font-style="italic">Unstructured language in,</text>
    <text x="72" y="271" fill="#E9EBEE" font-size="18" font-style="italic">validated structure out.</text>
  </g>

  <line x1="468" y1="58" x2="468" y2="282" stroke="#2C323C" stroke-width="1"/>

  <!-- what: one record, as the work actually transforms it -->
  <g font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace">
    <text x="512" y="94" fill="#868FA0" font-size="13.5">“the pump stopped working after two</text>
    <text x="512" y="114" fill="#868FA0" font-size="13.5"> weeks, very disappointed”</text>

    <path d="M520 136 v24 M513 153 l7 8 7 -8" fill="none" stroke="#8AA0FF" stroke-width="1.6"/>
    <text x="546" y="158" fill="#8AA0FF" font-size="12.5">extract, classify, validate</text>

    <g font-size="14.5">
      <text x="512" y="198" fill="#868FA0">product</text>
      <text x="628" y="198" fill="#E9EBEE">dispenser pump</text>
      <text x="512" y="224" fill="#868FA0">defect</text>
      <text x="628" y="224" fill="#E9EBEE">mechanism failure</text>
      <text x="512" y="250" fill="#868FA0">severity</text>
      <text x="628" y="250" fill="#E9EBEE">high</text>
    </g>

    <path d="M514 276 l5 6 10 -13" fill="none" stroke="#8AA0FF" stroke-width="2.2" stroke-linecap="round"/>
    <text x="538" y="281" fill="#8AA0FF" font-size="13">schema valid</text>
  </g>

  <line x1="884" y1="58" x2="884" y2="282" stroke="#2C323C" stroke-width="1"/>

  <!-- result: the payoff of the two decisions above -->
  <g>
    <g font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-weight="700" font-size="31" fill="#E9EBEE" text-anchor="end">
      <text x="1002" y="128">75%</text>
      <text x="1002" y="192">94%</text>
      <text x="1002" y="256">100%</text>
    </g>
    <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12" fill="#868FA0">
      <text x="1018" y="128">less api spend</text>
      <text x="1018" y="192">fewer tokens</text>
      <text x="1018" y="256">full coverage</text>
    </g>
    <line x1="936" y1="154" x2="1122" y2="154" stroke="#2C323C" stroke-width="1"/>
    <line x1="936" y1="218" x2="1122" y2="218" stroke="#2C323C" stroke-width="1"/>
  </g>
</svg>
