<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Rajeev Anand, Data and AI Lead at VCreaTek">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="1"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#0E1418"/>

  <!-- accent bar: short and deliberate, not a full-width rule -->
  <rect x="64" y="48" width="86" height="4" fill="#E8A33D"/>
  <rect x="150" y="48" width="240" height="4" fill="url(#edge)"/>

  <g font-family="Segoe UI, Inter, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">
    <text x="64" y="88" fill="#E8A33D" font-size="13" font-weight="600" letter-spacing="3.6">PRODUCTION AI SYSTEMS</text>
    <text x="64" y="152" fill="#F5F2EC" font-size="56" font-weight="700" letter-spacing="0.5">Rajeev Anand</text>
    <text x="64" y="196" fill="#5FB3B0" font-size="23" font-weight="600">Data &amp; AI Lead · VCreaTek</text>
    <text x="64" y="234" fill="#8FA3A8" font-size="16.5" font-weight="400">Agentic reasoning · FHIR ePI · Consumer intelligence · Azure · Python</text>
  </g>

  <!-- The mark: 6 tools in a reasoning loop, held inside 4 guardrail layers. -->
  <g transform="translate(1010 150)">
    <rect x="-100" y="-100" width="200" height="200" rx="26" fill="none" stroke="#2E7F84" stroke-width="1.5" stroke-opacity="0.30"/>
    <rect x="-82"  y="-82"  width="164" height="164" rx="22" fill="none" stroke="#2E7F84" stroke-width="1.5" stroke-opacity="0.48"/>
    <rect x="-64"  y="-64"  width="128" height="128" rx="18" fill="none" stroke="#2E7F84" stroke-width="1.5" stroke-opacity="0.68"/>
    <rect x="-46"  y="-46"  width="92"  height="92"  rx="14" fill="none" stroke="#2E7F84" stroke-width="1.5" stroke-opacity="0.90"/>

    <circle cx="0" cy="0" r="62" fill="none" stroke="#E8A33D" stroke-width="1.25" stroke-opacity="0.32" stroke-dasharray="3 6"/>

    <g fill="#E8A33D">
      <circle cx="0"      cy="-62" r="6.5"/>
      <circle cx="53.69"  cy="-31" r="6.5"/>
      <circle cx="53.69"  cy="31"  r="6.5"/>
      <circle cx="0"      cy="62"  r="6.5"/>
      <circle cx="-53.69" cy="31"  r="6.5"/>
      <circle cx="-53.69" cy="-31" r="6.5"/>
    </g>

    <circle cx="0" cy="0" r="5" fill="#5FB3B0"/>
  </g>

  <text x="1010" y="282" fill="#6E8085" font-size="12" letter-spacing="1.4" text-anchor="middle"
        font-family="Segoe UI, Inter, system-ui, sans-serif">6 TOOLS · 4 GUARDRAIL LAYERS</text>
</svg>
